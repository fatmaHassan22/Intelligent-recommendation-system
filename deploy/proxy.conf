server {
 listen 8443 ssl;
 server_name _;
 server_tokens off;
 ssl_certificate /etc/nginx/tls/server.crt;
 ssl_certificate_key /etc/nginx/tls/server.key;
 ssl_protocols TLSv1.2 TLSv1.3;
 ssl_session_tickets off;
 client_max_body_size 16k;
 # Do not log paths/query strings, student identifiers, tokens or IP addresses.
 access_log off;
 error_log /dev/stderr crit;
 add_header Strict-Transport-Security "max-age=31536000" always;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options DENY always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
 location ~ /(?:\.|node_modules|src/|package\.json) { return 404; }
 location /api/ {
  proxy_pass http://backend:3000;
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_set_header Connection "";
  proxy_read_timeout 70s;
  proxy_hide_header Content-Security-Policy;
  proxy_hide_header Strict-Transport-Security;
  proxy_hide_header X-Frame-Options;
  proxy_hide_header X-Content-Type-Options;
  proxy_hide_header Referrer-Policy;
 }
 location = /health {
  proxy_pass http://backend:3000/health;
  proxy_set_header X-Forwarded-Proto https;
 }
 location / { proxy_pass http://frontend:8080; proxy_set_header Host $http_host; }
}
